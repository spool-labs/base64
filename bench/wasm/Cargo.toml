[package]
name = "tape-base64-wasm-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone, like the criterion crate beside it.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
base64-simd = "0.8"
tape-base64 = { path = "../.." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
