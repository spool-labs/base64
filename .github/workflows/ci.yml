name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --features std
      - run: cargo clippy --all-targets --features internals

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both profiles: debug catches the overflow checks, release catches what
      # only shows up once the optimiser has been through the kernels.
      - run: cargo test
      - run: cargo test --release
      # The tests that pin a path reach for `testing`, which is behind the
      # `internals` feature, so without it they compile to nothing.
      - run: cargo test --features internals
      - run: cargo test --release --features internals
      # The benchmarks are a separate workspace and break silently when the
      # library's signatures move, so they are typechecked here.
      - run: cargo check --benches
        working-directory: bench

  portable:
    name: portable backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      # No vector units and no std, which is the arm neither runner reaches.
      - run: cargo build --lib --target thumbv6m-none-eabi

  miri:
    name: miri (x86 kernels)
    runs-on: ubuntu-latest
    env:
      # Miri has no cpuid, so the target features stand in for it and the forced
      # test pins the portable walk, AVX2 and AVX-512VBMI in turn.
      RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512vbmi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --target x86_64-unknown-linux-gnu --features internals --test forced

  valgrind:
    name: valgrind (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # An over-read still gives the right answer, so only valgrind sees it. Its
      # cpuid hides AVX-512, so the wide kernel is Miri's to check. forced pins
      # each x86 path and is empty on aarch64, where lengths runs the NEON kernel.
      - run: |
          bins=$(cargo test --release --features internals --test forced --test lengths --no-run \
            --message-format=json | jq -r 'select(.executable != null) | .executable')
          for bin in $bins; do
            valgrind --error-exitcode=9 --quiet "$bin"
          done

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # Nightly has lints the pinned toolchains do not, and a fuzz run is not the
    # place to find out about them.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # A smoke run, not a campaign. Long runs belong on a box, not on a pull request.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu decode -- -max_total_time=60
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu roundtrip -- -max_total_time=60
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu streaming -- -max_total_time=60

  wasm:
    name: wasm32 (portable and simd128)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --target wasm32-wasip1 --features internals
      # The simd128 kernel only exists under the target feature, so it gets its own run.
      - run: cargo test --target wasm32-wasip1 --features internals
        env:
          RUSTFLAGS: -C target-feature=+simd128 -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      - run: cargo check --lib --features std
