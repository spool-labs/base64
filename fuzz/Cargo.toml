[package]
name = "tape-base64-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone rather than a workspace member, so the published crate has
# neither these targets nor the dependencies they need.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4"
tape-base64 = { path = "..", features = ["internals"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
